services:
  db:
    image: postgres:16-alpine
    container_name: points-rewards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rewards
    ports:
      - "5433:5432"
    volumes:
      - points_rewards_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rewards"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  points_rewards_pgdata:
